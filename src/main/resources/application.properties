# ==========================================================================
# MySQL 데이터베이스 연결 정보
# ==========================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# (주의) 로컬 MySQL 포트가 3306이 아니거나 데이터베이스 이름이 다르면 수정하세요.
spring.datasource.url=jdbc:mysql://localhost:3306/note?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
# (주의) 본인의 MySQL 비밀번호로 반드시 변경하세요! (학원 기본값은 보통 **** 또는 root입니다)
spring.datasource.password=****

# ==========================================================================
# JPA (Hibernate) 자동 설정
# ==========================================================================
# update: 자바 엔티티 클래스(Note 등)를 보고 없는 테이블을 알아서 생성 및 수정해 줍니다.
spring.jpa.hibernate.ddl-auto=update
# 콘솔창에 JPA가 데이터베이스에 날리는 SQL 쿼리를 예쁘게 보여줍니다.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect