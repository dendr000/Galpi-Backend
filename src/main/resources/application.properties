# 파일 위치: Galpi/Galpi-Backend/src/main/resources/application.properties

# ==========================================================================
# MySQL 데이터베이스 연결 정보
# ==========================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/note?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

# 하드코딩된 계정 정보를 지우고 환경 변수로 치환
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================================================
# JPA (Hibernate) 자동 설정
# ==========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================================================
# 시크릿 게이트 (커스텀 로그인) 설정
# ==========================================================================
galpi.auth.passphrase=${AUTH_PASSPHRASE}
galpi.auth.jwt-secret=${AUTH_JWT_SECRET}

# ==========================================================================
# 정적 미디어(이미지/폰트) 루트 경로 — WebConfig / FileUploadController가 공유
# ==========================================================================
galpi.media.root=C:/dev/Galpi/Galpi-Media

# ==========================================================================
# 서버 포트 — 기본값 8080은 Oracle XE(관리용 HTTP 서비스) 등과 자주 충돌해서 18080으로 고정
# 프론트 개발 서버는 Galpi-Frontend/.env 의 VITE_API_BASE_URL 로 이 포트를 가리킨다
# ==========================================================================
server.port=18080
