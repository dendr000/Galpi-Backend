# 파일 위치: Galpi/Galpi-Backend/src/main/resources/application-exe.properties
#
# Electron 패키징(exe) 빌드 전용 프로파일 — 개발 서버(application.properties)와
# 동일한 MySQL DB/미디어 폴더를 그대로 공유한다(브라우저에서 만든 작품이 exe에도
# 바로 보이도록). 로컬 PC 1대에서만 쓰는 걸 전제로 하며, DB_USERNAME/DB_PASSWORD는
# .env에서 읽어온다(electron-builder가 패키징 시 같이 복사함).
# 활성화 방법: -Dspring.profiles.active=exe 또는 환경변수 SPRING_PROFILES_ACTIVE=exe

# ==========================================================================
# MySQL 데이터베이스 연결 정보 — application.properties와 동일
# ==========================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/note?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================================================
# 정적 미디어(이미지/폰트) 루트 경로 — 개발용 Galpi-Media와 동일 경로 공유
# ==========================================================================
galpi.media.root=C:/dev/Galpi/Galpi-Media
