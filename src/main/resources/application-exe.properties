# 파일 위치: Galpi/Galpi-Backend/src/main/resources/application-exe.properties
#
# Electron 패키징(exe) 빌드 전용 프로파일 — MySQL 대신 내장형 H2 DB를 사용한다.
# 평소 개발 서버(application.properties, MySQL)에는 영향을 주지 않는다.
# 활성화 방법: -Dspring.profiles.active=exe 또는 환경변수 SPRING_PROFILES_ACTIVE=exe

# ==========================================================================
# H2 내장 데이터베이스 (파일 기반 — 사용자 홈 디렉터리 아래 저장, 재설치해도 유지)
# ==========================================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:${user.home}/.galpi/data/galpi;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 내장 DB 상태를 직접 들여다보기 위한 디버그 콘솔 (exe 프로파일에서만 켜짐)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================================
# 정적 미디어(이미지/폰트) 루트 경로 — 사용자 데이터 폴더 기준 (개발용 Galpi-Media와 별개)
# 주의: 이 폴더는 비어 있는 상태로 시작한다. 실제 이미지/폰트 파일을 옮기는 건
# 별도 작업(마이그레이션)이며 아직 하지 않았다.
# ==========================================================================
galpi.media.root=${user.home}/.galpi/media
